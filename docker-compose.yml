# Pile complète en local : site public, back-office, API et PostgreSQL.
#   docker compose up --build
# Site : http://localhost:3000 · Back-office : http://localhost:3001 · API : http://localhost:8000/docs
# Valeurs de développement uniquement (aucun secret réel) ; ne pas utiliser en production.
name: para-institut

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: para
      POSTGRES_PASSWORD: para_dev
      POSTGRES_DB: para_official
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U para -d para_official"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./services/api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://para:para_dev@postgres:5432/para_official
      SECRET_KEY: local-docker-dev-only-0123456789
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    # Migrations appliquées au démarrage (environnement local uniquement)
    command: ["sh", "-c", "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CONTENT_MODE: demo
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports: ["3000:3000"]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports: ["3001:3001"]

volumes:
  pgdata:
