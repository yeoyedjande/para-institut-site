name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web, back-office et paquets (lint, types, tests, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @para/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "1"

  api:
    name: API (ruff, mypy, pytest + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: para
          POSTGRES_PASSWORD: para_ci
          POSTGRES_DB: para_official_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U para -d para_official_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://para:para_ci@127.0.0.1:5432/para_official_test
      REQUIRE_INTEGRATION_DB: "1"
      SECRET_KEY: ci-secret-key-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
